[project]
name = "say-less"
version = "0.1.0"
description = "Repair for bounded slots in voice agents"
requires-python = ">=3.12"
dependencies = [
    "websockets>=14.0",
    "openai>=1.40",
    "Metaphone>=0.6",
    "rapidfuzz>=3.9",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
